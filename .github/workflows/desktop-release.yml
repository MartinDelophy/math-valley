name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft GitHub prerelease after every platform passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/verify-desktop-tag.mjs
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:desktop
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/Math Valley.app/Contents/MacOS/Math Valley
          - runner: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/Math Valley.app/Contents/MacOS/Math Valley
          - runner: windows-2022
            platform: win
            arch: x64
            executable: release/win-unpacked/Math Valley.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm run build
      - name: Package desktop app
        working-directory: desktop
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Smoke-test the packaged application
        run: node scripts/smoke-desktop.mjs --executable "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_draft
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Checksum and upload release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/create-desktop-release.mjs
